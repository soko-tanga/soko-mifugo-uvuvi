<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUBSOKO - Soko la Tanga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f0;padding:12px}
.header{background:#fff;text-align:center;padding:20px 12px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px}
.header h1{font-size:28px;color:#111}
.header h1 span{color:#0a7a42}
.card{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.card img{width:100%;height:200px;object-fit:cover;display:block}
.card-body{padding:16px;text-align:center}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:16px;cursor:pointer;text-decoration:none}
.btn-green{background:#0a7a42}
.btn-blue{background:#1a4d8f}
.btn-orange{background:#e67e22}
.formBox{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;display:none}
.formBox label{display:block;text-align:left;font-weight:bold;margin:12px 0 5px;font-size:14px}
.formBox input,.formBox select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fff}
.footer{text-align:center;color:#888;font-size:12px;padding:10px}
.itemBox{background:#f0fdf4;padding:12px;border-radius:10px;margin-bottom:8px;text-align:left}
</style>
</head>
<body>

<div class="header">
<h1>🌾 HUB<span>SOKO</span></h1>
<p>Soko la Kidijitali la Tanga - Mifugo & Uvuvi</p>
<p style="font-size:12px;color:#0a7a42;font-weight:bold">📍 Tanga, Tanzania</p>
</div>

<!-- SOKO LA MIFUGO -->
<div class="card">
<img src="https://images.unsplash.com/photo-1500595046743-cd271d694d30?w=800&q=80">
<div class="card-body">
<h2>🐐 SOKO LA MIFUGO</h2>
<p>Mbuzi, Ng'ombe, Kuku, Kondoo</p>
<button class="btn btn-green" onclick="funguaFomu('Mifugo')">UZA HAPA →</button>
<div id="listMifugo" style="margin-top:12px"></div>
</div>
</div>

<!-- SOKO LA UVUVI -->
<div class="card">
<img src="https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=800&q=80">
<div class="card-body">
<h2>🐟 SOKO LA MAZAO YA UVUVI</h2>
<p>Samaki, Dagaa, Kamba, Ngisi</p>
<button class="btn btn-blue" onclick="funguaFomu('Uvuvi')">UZA HAPA →</button>
<div id="listUvuvi" style="margin-top:12px"></div>
</div>
</div>

<!-- FOMU YA UZA - IMEREKEBISHWA -->
<div class="formBox" id="fomuUza">
<h2 style="text-align:center">📝 FOMU YA UZA - <span id="sokoJina"></span></h2>

<!-- 1. AINA YA BIDHAA - MANUAL, HAITAJAZA AUTO -->
<label>1. Aina ya Bidhaa *</label>
<input type="text" id="ainaBidhaa" placeholder="Andika mwenyewe: Mf. Mbuzi, Samaki, Kuku..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<p style="font-size:12px;color:#888;text-align:left">Andika mwenyewe, usichague kwenye list.</p>

<!-- 2. JINA LA MUUZAJI - BADALA YA JINA LA BIDHAA -->
<label>2. Jina la Muuzaji *</label>
<input type="text" id="jinaMuuzaji" placeholder="Andika jina lako kamili: Mf. Juma Mwalimu" autocomplete="off">

<label>3. Bei (TZS) *</label>
<input type="number" id="bei" placeholder="Mf. 150000">

<label>4. Namba ya Simu / WhatsApp *</label>
<input type="tel" id="simu" placeholder="Mf. 0755123456" autocomplete="off">

<label>5. Wilaya - Tanga</label>
<select id="wilaya">
<option value="Tanga Mjini">Tanga Mjini</option>
<option value="Pangani">Pangani</option>
<option value="Muheza">Muheza</option>
<option value="Korogwe">Korogwe</option>
<option value="Handeni">Handeni</option>
<option value="Kilindi">Kilindi</option>
<option value="Lushoto">Lushoto</option>
<option value="Mkinga">Mkinga</option>
</select>

<button class="btn btn-orange" onclick="tumaBidhaa()" style="margin-top:18px">TUMA BIDHAA ✅</button>
<button class="btn" onclick="document.getElementById('fomuUza').style.display='none'" style="background:#999;margin-top:8px">Funga ❌</button>
</div>

<div class="footer">© 2026 HubSoko Tanga - Soko la Wananchi</div>

<script>
let sokoChaguliwa = 'Mifugo';
let bidhaa = JSON.parse(localStorage.getItem('hubsoko_bidhaa')||'[]');

function funguaFomu(soko){
  sokoChaguliwa = soko;
  document.getElementById('sokoJina').innerText = soko;
  document.getElementById('fomuUza').style.display='block';
  document.getElementById('ainaBidhaa').value='';
  document.getElementById('jinaMuuzaji').value='';
  document.getElementById('bei').value='';
  document.getElementById('simu').value='';
  window.scrollTo(0, document.getElementById('fomuUza').offsetTop - 10);
}

function tumaBidhaa(){
  let aina = document.getElementById('ainaBidhaa').value.trim();
  let muuzaji = document.getElementById('jinaMuuzaji').value.trim();
  let bei = document.getElementById('bei').value.trim();
  let simu = document.getElementById('simu').value.trim();
  let wilaya = document.getElementById('wilaya').value;

  if(!aina || !muuzaji || !bei || !simu){ alert('Tafadhali jaza Aina ya Bidhaa, Jina la Muuzaji, Bei na Simu'); return; }

  bidhaa.push({soko:sokoChaguliwa, aina:aina, muuzaji:muuzaji, bei:bei, simu:simu, wilaya:wilaya});
  localStorage.setItem('hubsoko_bidhaa', JSON.stringify(bidhaa));
  render();
  alert('Asante '+muuzaji+'! Bidhaa yako ya '+aina+' imeongezwa kwenye Soko la '+sokoChaguliwa);
  document.getElementById('fomuUza').style.display='none';
}

function render(){
  let m = bidhaa.filter(b=>b.soko==='Mifugo');
  let u = bidhaa.filter(b=>b.soko==='Uvuvi');
  document.getElementById('listMifugo').innerHTML = m.map(b=>`<div class="itemBox">🐐 <b>${b.aina}</b> - TZS ${Number(b.bei).toLocaleString()}<br>👤 Muuzaji: <b>${b.muuzaji}</b> | 📍 ${b.wilaya}<br><a href="https://wa.me/255${b.simu.replace(/^0/,'')}" style="color:#0a7a42;font-weight:bold">WhatsApp Muuzaji →</a></div>`).join('') || '<p style="color:#999;font-size:13px">Hakuna bidhaa bado</p>';
  document.getElementById('listUvuvi').innerHTML = u.map(b=>`<div class="itemBox">🐟 <b>${b.aina}</b> - TZS ${Number(b.bei).toLocaleString()}<br>👤 Muuzaji: <b>${b.muuzaji}</b> | 📍 ${b.wilaya}<br><a href="https://wa.me/255${b.simu.replace(/^0/,'')}" style="color:#1a4d8f;font-weight:bold">WhatsApp Muuzaji →</a></div>`).join('') || '<p style="color:#999;font-size:13px">Hakuna bidhaa bado</p>';
}
render();
</script>
</body>
</html>
